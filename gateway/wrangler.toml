name = "openatlas-gateway"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# Rolling-window license cap from the N-ATLaS license.
ACTIVE_USER_CAP = "1000"
ACTIVE_WINDOW_DAYS = "30"
# How long the gateway waits for a queued RunPod job (covers cold starts) before returning 504.
UPSTREAM_TIMEOUT_MS = "300000"
# Real RunPod by default. Point at dev/mock-runpod for local testing ONLY; /v1/health reports it.
RUNPOD_API_BASE = "https://api.runpod.ai/v2"

# Secrets (set with `wrangler secret put NAME`, or in .dev.vars locally):
#   RUNPOD_API_KEY    RunPod key, ideally restricted to the two endpoints below
#   LLM_ENDPOINT_ID   RunPod endpoint serving N-ATLaS LLM (vLLM worker)
#   ASR_ENDPOINT_ID   RunPod endpoint serving the four N-ATLaS ASR models (workers/asr)
#   ADMIN_TOKEN       for /v1/admin/* and /v1/usage

[[d1_databases]]
binding = "DB"
database_name = "openatlas"
database_id = "84031f4d-13ea-4b3b-ba0e-10b52ac3ae5a"
