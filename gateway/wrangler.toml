name = "openatlas-gateway"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
# Rolling-window license cap from the N-ATLaS license.
ACTIVE_USER_CAP = "1000"
ACTIVE_WINDOW_DAYS = "30"
# How long the gateway waits for the backend (covers model loading / cold starts) before returning 504.
UPSTREAM_TIMEOUT_MS = "300000"
# Which backend protocol to speak:
#   "http"   any host running deploy/server/natlas_server.py (Colab interim, NiHub intended)
#   "runpod" RunPod Serverless fallback
BACKEND_KIND = "http"
# Only used when BACKEND_KIND = "runpod".
RUNPOD_API_BASE = "https://api.runpod.ai/v2"
# Limits given to each newly issued key (change per key with scripts/keys.mjs limits). "0" = no limit.
#   daily: requests per rolling 24 h. users: the key's share of the license cap above, so one key can't
#   use up every other developer's headroom.
DEFAULT_DAILY_REQUEST_LIMIT = "1000"
DEFAULT_KEY_MAX_ACTIVE_USERS = "100"
# Optional speech output (POST /v1/audio/speech, the SDK's speak()): a final-stage renderer of text N-ATLaS has
# already written. "true" allows it; anything else switches the route off without touching the rest.
TTS_ENABLED = "true"

# Secrets (set with `wrangler secret put NAME`, or in .dev.vars locally).
# deploy/set-backend.mjs sets the backend ones; changing them needs no redeploy.
#   BACKEND_URL       base URL of the backend host (http kind), e.g. the Colab tunnel or NiHub URL
#   BACKEND_API_KEY   the backend's BACKEND_API_KEY (http kind)
#   RUNPOD_API_KEY, LLM_ENDPOINT_ID, ASR_ENDPOINT_ID   (runpod kind)
#   ADMIN_TOKEN       for /v1/admin/* and /v1/usage

[[d1_databases]]
binding = "DB"
database_name = "openatlas"
database_id = "84031f4d-13ea-4b3b-ba0e-10b52ac3ae5a"
