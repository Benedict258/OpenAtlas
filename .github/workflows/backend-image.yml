name: Build backend image

# The Docker image for deploy/server (natlas_server.py). CI has no GPU and no access to the gated models,
# so the smoke test checks what it can: the image builds, the server starts and answers /health, and model
# routes refuse requests without the backend key. Loading and serving the models needs a GPU and HF_TOKEN.
on:
  push:
    branches: [main]
    paths: ["deploy/server/**", ".github/workflows/backend-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pytorch base image is large; free up runner disk first.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - name: Build
        run: docker build -t openatlas-backend:ci deploy/server

      - name: Smoke test (no GPU, no model access)
        run: |
          docker run -d --name backend -p 8000:8000 -e HF_TOKEN=hf_not_a_real_token -e BACKEND_API_KEY=ci-smoke-test-key-0123456789 openatlas-backend:ci
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 2; done
          echo
          curl -sf localhost:8000/health | python3 -c 'import json,sys; h=json.load(sys.stdin); assert h["status"] in ("loading","error"), h; print("health:", h["status"], h["stage"])'
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/v1/chat/completions -H 'content-type: application/json' -d '{"messages":[{"role":"user","content":"hi"}]}')
          echo "chat without key: HTTP $code"; test "$code" = 401
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8000/v1/chat/completions -H 'Authorization: Bearer ci-smoke-test-key-0123456789' -H 'content-type: application/json' -d '{"messages":[{"role":"user","content":"hi"}]}')
          echo "chat with key, models not loaded: HTTP $code"; test "$code" = 503
          docker logs backend | tail -20

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        run: |
          for tag in latest ${{ github.sha }}; do
            docker tag openatlas-backend:ci ghcr.io/benedict258/openatlas-backend:$tag
            docker push ghcr.io/benedict258/openatlas-backend:$tag
          done
