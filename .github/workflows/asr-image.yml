name: Build ASR worker image

on:
  push:
    branches: [main]
    paths: ["workers/asr/**", ".github/workflows/asr-image.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The pytorch base image is large; free up runner disk first.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: workers/asr
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/benedict258/openatlas-asr:latest
            ghcr.io/benedict258/openatlas-asr:${{ github.sha }}
