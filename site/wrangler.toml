name = "openatlas-site"
main = "src/worker.mjs"
compatibility_date = "2026-09-01"

# Copies pages + the starter kits' live windows into ./dist before dev and deploy.
[build]
command = "node build.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"

# The gateway Worker, called directly (Worker-to-Worker fetches over workers.dev are blocked: error 1042).
[[services]]
binding = "GATEWAY"
service = "openatlas-gateway"

[vars]
OPENATLAS_BASE_URL = "https://api.getopenatlas.xyz"

# Secret (wrangler secret put OPENATLAS_API_KEY, or .dev.vars locally):
#   OPENATLAS_API_KEY  the key the website's live kit demos use (label it "website-demos")

# Per-IP limit on the live demos and the key request form (Workers Rate Limiting): 10 POSTs a minute per
# IP. The demos share one OpenAtlas key ("website-demos"), which also has its own daily quota and share
# of the license cap in the gateway.
[[ratelimits]]
name = "DEMO_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# The API key request form, per IP: 3 a minute (the gateway also caps keys per email and per IP per day).
[[ratelimits]]
name = "KEY_LIMITER"
namespace_id = "1002"
simple = { limit = 3, period = 60 }
